run:
  max_turns: 6
  max_tool_calls: 8
  temperature: 0.7
  conditions:
    - chat_only
    - agent_tool_use

models:
  - model_id: qwen3_8b_local
    adapter: hf_transformers_json
    model: Qwen/Qwen3-8B
    device: cpu
    temperature: 0.7
    qwen_no_think: true
    max_tool_calls: 1
    max_new_tokens: 128
