run:
  max_turns: 6
  max_tool_calls: 8
  temperature: 0.7
  conditions:
    - chat_only
    - agent_tool_use

models:
  # Meta does not publish an official "Llama 3.2 8B" text checkpoint.
  # This uses the official 8B Llama-family substitute instead. It may require
  # Hugging Face access approval and HF_TOKEN.
  - model_id: llama3_1_8b_instruct_local
    adapter: hf_transformers_json
    model: meta-llama/Llama-3.1-8B-Instruct
    device: cpu
    temperature: 0.7
    max_tool_calls: 1
    max_new_tokens: 128
